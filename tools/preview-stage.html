<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage preview — phase 5 checkpoint</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Standalone harness for the three.js stage substrate. Not part of
  the live site — main.js/index.html still run the CSS-3D scene.js
  exactly as before. Started as the phase-3 shell/lighting checkpoint;
  phase 4 added real cases + books + the per-room spine atlas + raycast
  hover/select + the a11y mirror. Phase 5 adds real doorway openings
  (holes cut into the side walls), a light spill in each opening, and
  a DOM sign shown on hover/focus (src/js/scene/doors.js, plus the
  createDoorController()/attachDoorPicking() additions to interact.js)
  — per IMPLEMENTATION.md §3 (row 5, points 2 & 3). Phase 6 adds props
  as textured planes (src/js/scene/props.js) — art SVGs alpha-mapped
  onto contain-fit planes, hand-painted canvas textures for the ten
  specially-coded types, and real shade+cord geometry for the lamp
  fixture (the bare bulb-sphere stand-in from phase 3 now has a real
  fixture around it) — per IMPLEMENTATION.md §3 (row 6, point 9).

  Phase 7 adds the table (src/js/scene/tables.js — a real 3D table,
  books lying flat covers-up, per PLAN.md point 10) and the camera
  pose rig (src/js/scene/poses.js — named, tweened poses: `room`,
  `shelf:<caseId>` square-on to a case, `table:<id>` looking down at a
  table — per IMPLEMENTATION.md §4.3 / PLAN.md points 6, 8 and 10).
  Picking is unified this phase too: the separate
  attachPointerPicking()/attachDoorPicking() calls are replaced by ONE
  attachScenePicking() over books (shelf AND table), doors, and
  "camera pose" targets (cases + the table's own frame) at once — see
  interact.js's own doc comment for why a case's click sensor sitting
  directly behind that same case's books makes two independent
  raycasters actively wrong, not just redundant. The a11y mirror gains
  a fourth input: opts.onFocus flies the camera to whatever was just
  Tab'd to, closing the TODO(phase 7) phase 5 left in a11y.js.

  Serve with `npm start`, then open
  http://localhost:8099/tools/preview-stage.html — phase 10 gave
  server/index.js a route for exactly this path (see there), so this
  harness no longer needs a server of its own. Do NOT run
  `python3 -m http.server 8099` instead: a stray one of those, left
  running from an earlier session, is the exact two-server port trap
  that has already cost this project two sessions (HANDOFF-PHASE9.md) —
  it silently holds :8099 so `npm start`'s own Express server dies on
  bind, and a whole QA pass then runs against the static server none the
  wiser (no `/api/book`, no other route this repo's server serves —
  the only symptom last time was a single easy-to-miss console 404).
  `npm start` is the one server now, for the live site and this harness
  alike; if you must check who is actually answering :8099, `curl -sI`
  it and look at the `Server:` header.

  Query params:
    ?room=<id>   which room to build (default: glasshouse)
    ?orbit=1     free-look with mouse (OrbitControls) instead of the
                 fixed §4.2 camera pose, for eyeballing the shell
    ?exposure=N  override renderer.toneMappingExposure
    ?books=0     skip cases/books/a11y mirror entirely (shell+lights
                 only, i.e. the old phase-3 view)
    ?mirror=1    force the a11y mirror's buttons visible (not just
                 focused) — for eyeballing the mirror itself, not how
                 a screen reader user would ever see it
    ?doors=0     skip doorway holes/sensors/lights/signs entirely
                 (shell without cut-outs, i.e. the pre-phase-5 view —
                 useful for isolating a books/shell regression from a
                 doors regression)
    ?signs=0     build doors, but skip the DOM hover/focus signs (the
                 sign container costs nothing at 0-6 nodes/room, but
                 this isolates the sign layer for a screenshot)
    ?dli=N       override door PointLight intensity (see doors.js's
                 DOOR_LIGHT_INTENSITY) — for tuning against a screenshot
    ?ddist=N     override door PointLight distance
    ?props=0     skip set dressing entirely (shell+lights+books+doors
                 only, i.e. the pre-phase-6 view — isolates a props
                 regression from everything else)
    ?tables=0    skip the table entirely (isolates a table regression
                 from books/doors/props, same spirit as the other
                 ?x=0 levers)
    ?poses=0     no pose rig at all — the fixed §4.2 camera, i.e. the
                 pre-phase-7 view. Cases/tables are still built and
                 still hoverable (setHighlight still fires), they just
                 can't move the camera: rig is null, and every
                 rig?.goTo()/rig?.back() call in this file is a no-op.
    ?pose=<name> start in that pose INSTANTLY (no tween) — for
                 screenshots, e.g. ?pose=shelf:back or
                 ?pose=table:fronttable. Unknown/unresolvable names are
                 a no-op (poses.js's goTo() contract), so a room with
                 no left case simply ignores ?pose=shelf:left.
    ?reduced=1   force prefers-reduced-motion behaviour (every pose
                 change jumps instead of tweening), overriding the
                 real media query — for tests that can't easily flip
                 an OS setting.
    ?orbit=1     — see above — additionally means NO POSE RIG AT ALL
                 (not merely no wheel/key bindings): OrbitControls owns
                 the camera outright, and clicking, tabbing or ending
                 an orbit drag on empty floor would otherwise each
                 start a tween racing controls.update(). Implies
                 ?poses=0 in effect; ?pose=<name> is ignored.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0a0706; }
  #wrap { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 2;
    font: 12px/1.5 ui-monospace, monospace; color: #e8dcc8;
    background: rgba(10,7,6,.72); padding: 8px 10px; border-radius: 6px;
    pointer-events: none; white-space: pre;
  }
  #err {
    position: fixed; inset: 0; z-index: 3; display: none;
    background: #1a0e0c; color: #ffb4a0; font: 13px/1.5 monospace;
    padding: 24px; white-space: pre-wrap; overflow: auto;
  }
  /* ?mirror=1 only: make the a11y mirror's buttons visible so they
     can be eyeballed directly, instead of the clip-hidden default
     (see src/js/scene/a11y.js) a screen-reader user would get. Not
     used by the real accessibility path, testing aid only. */
  /* the clip-hiding lives on the role="listitem" WRAPPER since phase 10
     (a11y.js — the button must keep its own implicit button role), so
     this un-hides the wrapper, not the button. */
  body.show-mirror .scene-a11y-mirror [role="listitem"] {
    position: static !important; width: auto !important; height: auto !important;
    margin: 1px !important; padding: 0 !important; clip: auto !important; clip-path: none !important;
    display: inline-block;
  }
  body.show-mirror .scene-a11y-mirror button {
    display: inline-block; padding: 2px 6px; font: 11px monospace;
    color: #e8dcc8; background: #241a12; border: 1px solid #4a382a;
  }
  body.show-mirror #mirror-wrap {
    position: fixed; right: 0; top: 0; bottom: 0; width: 260px; overflow: auto;
    background: rgba(10,7,6,.88); z-index: 2; padding: 8px;
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "/vendor/three/build/three.module.js",
    "three/addons/": "/vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="wrap"><canvas id="stage-canvas"></canvas></div>
<div id="hud"></div>
<pre id="err"></pre>

<script type="module">
import { createStage } from '/src/js/scene/stage.js';
import { buildRoom } from '/src/js/scene/room.js';
import { ROOMS } from '/src/js/data/rooms.js';
import { booksIn } from '/src/js/shop.js';

// Phase 10 moved the assembly this file used to do inline into
// src/js/scene/room.js — see that file's header for why (short version:
// main.js needs the same assembly, and a reference that drifts from the
// thing it references is worse than no reference). Every ?x=0 lever
// below is now an option on buildRoom(); the harness keeps the HUD, the
// query-parameter surface and ?orbit=1, which are harness-only concerns.

const params = new URLSearchParams(location.search);
const roomId = params.get('room') || 'glasshouse';
const room = ROOMS.find((r) => r.id === roomId) || ROOMS[0];
const wantOrbit = params.get('orbit') === '1';
const startPose = params.get('pose'); // ?pose=<name> — instant start, for screenshots
const forceReduced = params.get('reduced') === '1';
if (params.get('mirror') === '1') document.body.classList.add('show-mirror');

const canvas = document.getElementById('stage-canvas');
const hud = document.getElementById('hud');
const errBox = document.getElementById('err');

window.addEventListener('error', (e) => showError(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showError(e.reason));
function showError(err) {
  errBox.style.display = 'block';
  errBox.textContent = (err && err.stack) || String(err);
  window.__stageError = String((err && err.message) || err);
}

const exposure = params.has('exposure') ? Number(params.get('exposure')) : undefined;
const stage = createStage(canvas, exposure !== undefined ? { toneMappingExposure: exposure } : {});

const mirrorWrap = document.createElement('div');
mirrorWrap.id = 'mirror-wrap';
document.body.appendChild(mirrorWrap);
const signWrap = document.createElement('div');
signWrap.id = 'door-signs';
document.body.appendChild(signWrap);

let lastOpened = '';
let lastDoor = '';

// ?orbit=1 means NO POSE RIG AT ALL, not merely no key/wheel bindings:
// OrbitControls owns the camera outright, and an orbit drag ends in a
// `click` on empty floor, which would otherwise start a 700ms tween
// racing controls.update(). One owner of the camera at a time.
const handle = buildRoom(stage, room, {
  booksFor: booksIn,
  books: params.get('books') !== '0',
  doors: params.get('doors') !== '0',
  signs: params.get('signs') !== '0',
  props: params.get('props') !== '0',
  tables: params.get('tables') !== '0',
  poses: params.get('poses') !== '0' && !wantOrbit,
  poseKeys: true,                 // the harness has no other keyboard owner
  reducedMotion: forceReduced || undefined,
  mirrorContainer: mirrorWrap,
  signContainer: signWrap,
  onBookActivate: (entry) => {
    lastOpened = `${entry.book.title} (${entry.book.id})`;
    console.log('book:open', entry.book.id, entry.book.title);
    updateHud();
  },
  onDoorActivate: (entry) => {
    lastDoor = `${entry.room.name} (${entry.room.id})`;
    console.log('door:go', entry.room.id, entry.room.name);
    updateHud();
  },
});

const rig = handle.rig;
if (startPose && rig) rig.goTo(startPose, { instant: true }); // land there before the first render

if (wantOrbit) {
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  const controls = new OrbitControls(stage.camera, stage.renderer.domElement);
  controls.target.set(0, 470, -600);
  controls.update();
  stage.onFrame(() => controls.update());
}

stage.onFrame(() => updateHud());

const lampCount = (room.props || []).filter((p) => p.t === 'lamp').length;

function updateHud() {
  hud.textContent =
    `room: ${room.id}  kind: ${room.kind}\n` +
    `lamps: ${lampCount}  ambient: on\n` +
    `camera fov: ${stage.camera.fov.toFixed(1)}deg  exposure: ${stage.renderer.toneMappingExposure}\n` +
    (wantOrbit ? 'drag to orbit\n' : 'pose rig (?orbit=1 to free-look)\n') +
    `books: ${handle.entries.length}  doors: ${handle.doorEntries.length}  props: ${(room.props || []).length}\n` +
    (handle.tableRig
      ? `table: ${handle.table.id} (${handle.tableEntries.length} books, spread ${handle.tableRig.spread.toFixed(2)})\n`
      : 'table: none\n') +
    (rig
      ? `pose: ${rig.current}  t: ${rig.t.toFixed(2)}  tweening: ${rig.tweening}\n`
      : `pose: skipped (${wantOrbit ? '?orbit=1 owns the camera' : '?poses=0'})\n`) +
    `ready: ${handle.isReady}\n` +
    (lastOpened ? `last opened: ${lastOpened}\n` : '') +
    (lastDoor ? `last door: ${lastDoor}` : '');
}
updateHud();
handle.ready.then(updateHud);

stage.start();

// exposed for Playwright / manual poking. `__roomReady` is deliberately
// a plain boolean, not handle.ready itself — page.evaluate() cannot hand
// a live Promise back across the bridge.
window.__stage = stage;
window.__room = handle;
window.__stageRoom = room.id;
window.__entries = handle.entries;
window.__controller = handle.bookController;
window.__mirror = handle.mirror;
window.__doorEntries = handle.doorEntries;
window.__doorController = handle.doorController;
window.__cases = handle.cases;
window.__tableRig = handle.tableRig;
window.__tableEntries = handle.tableEntries;
window.__poseRig = rig;
Object.defineProperty(window, '__roomReady', { get: () => handle.isReady });
</script>
</body>
</html>
