<script>
/* Old deep links. The bookshop used to live at "/", so shared links look like
   philosophicaltech.com/#/front. Send them where the shop lives now, before
   anything renders. The form hashes (#tractatus …) have no slash: no clash. */
if (/^#\/[\w-]+/.test(location.hash)) location.replace('/bookshop/' + location.search + location.hash);
/* Apply a remembered theme before first paint (no flash). Storage can throw. */
try { var t = localStorage.getItem('pt-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
