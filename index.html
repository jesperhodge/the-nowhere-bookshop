<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Nowhere Bookshop — a small shop that goes on forever</title>
<meta name="description" content="A curated 3D bookshop. Wander the rooms, pull books off the shelf, read the blurb, and buy from an independent seller. Every shelf hand-picked from prize lists and critics' choices — never bestsellers by default.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1a1210">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231d1512'/><rect x='7' y='7' width='5' height='18' rx='1' fill='%23c98a4b'/><rect x='13.5' y='9' width='4' height='16' rx='1' fill='%238fa9a1'/><rect x='19' y='6' width='5' height='19' rx='1' fill='%23b4574b'/></svg>">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/scene.css">
<link rel="stylesheet" href="src/styles/themes.css">
<link rel="stylesheet" href="src/styles/ui.css">
</head>
<body>

<!-- ─── The door ─────────────────────────────────────────────── -->
<div id="door" class="door" role="dialog" aria-label="Entrance">
  <div class="door__inner">
    <p class="door__eyebrow">Est. nowhere in particular</p>
    <h1 class="door__title">The Nowhere<br><em>Bookshop</em></h1>
    <p class="door__blurb">
      A small shop, four rooms wide, that keeps going.<br>
      Nothing here is on the shelf because it sold well.
    </p>
    <button id="enter" class="door__btn" type="button">
      <span class="door__btn-label">Push the door open</span>
      <span class="door__bell" aria-hidden="true">🔔</span>
    </button>
    <p class="door__meta"><span id="doorCount">…</span> books, hand-picked from prize lists, critics' polls and long arguments.</p>
  </div>
  <div class="door__rain" aria-hidden="true"></div>
</div>

<!-- ─── The shop ─────────────────────────────────────────────── -->
<main id="shop" class="shop" hidden>

  <div class="stage" id="stage">
    <div class="stage__fit" id="fit">
      <div class="room" id="room"></div>
    </div>
    <div class="dlabels" id="dlabels" aria-hidden="true"></div>
    <canvas class="ambience" id="ambience" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
  </div>

  <!-- Top bar -->
  <header class="topbar">
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <div class="topbar__tools">
      <button class="tool" id="btnSearch" type="button" title="Search the shop (press /)" aria-label="Search the shop">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span class="tool__txt">Search</span>
      </button>
      <button class="tool" id="btnMap" type="button" title="The shop plan (press M)" aria-label="Open the shop plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v14l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v14M15 6.5v14"/></svg>
        <span class="tool__txt">Plan</span>
      </button>
      <button class="tool" id="btnParcel" type="button" title="Your parcel (press P)" aria-label="Open your parcel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M3 4.5h18V8H3z"/><path d="M12 4.5v15.5"/></svg>
        <span class="tool__txt">Parcel</span>
        <span class="tool__badge" id="parcelCount" hidden>0</span>
      </button>
      <button class="tool tool--icon" id="btnSound" type="button" title="Ambient sound" aria-label="Toggle ambient sound" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-on"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.2 6.6a7.5 7.5 0 0 1 0 10.8"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ic-off"><path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
  </header>

  <!-- Room caption -->
  <div class="placard" id="placard" aria-live="polite"></div>

  <!-- Bottom bar -->
  <footer class="dock">
    <button class="dock__btn dock__btn--back" id="btnBack" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span id="backLabel">Back</span>
    </button>
    <button class="dock__btn dock__btn--shelf" id="btnShelf" type="button" title="Everything on this shelf (press S)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h4v16H4zM10 6h4v14h-4zM16 4h4v16h-4z"/></svg>
      <span>The shelf</span>
    </button>
    <button class="dock__btn dock__btn--bell" id="btnBell" type="button" title="Ask the shopkeeper for something you'd never have found">
      <span class="dock__bell" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4.5 17h15M12 4.2c-4 0-6.2 2.6-6.2 6.1 0 3.6-1 5-1 5h14.4s-1-1.4-1-5c0-3.5-2.2-6.1-6.2-6.1z"/><path d="M12 3v1.2"/></svg>
      </span>
      <span>Ring the bell</span>
    </button>
    <div class="dock__doors" id="dockDoors"></div>
  </footer>

  <!-- Shelf paging hint -->
  <div class="hint" id="hint" hidden></div>
</main>

<!-- ─── Book panel ───────────────────────────────────────────── -->
<div class="sheet" id="sheet" hidden aria-hidden="true">
  <div class="sheet__scrim" data-close></div>
  <div class="sheet__body" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" id="sheetBody"></div>
</div>

<!-- ─── Overlays ─────────────────────────────────────────────── -->
<div class="overlay" id="mapOverlay" hidden aria-hidden="true">
  <div class="overlay__scrim" data-close></div>
  <div class="overlay__body overlay__body--map" role="dialog" aria-modal="true" aria-label="The shop plan" tabindex="-1" id="mapBody"></div>
</div>

<div class="overlay" id="searchOverlay" hidden aria-hidden="true">
  <div class="overlay__scrim" data-close></div>
  <div class="overlay__body overlay__body--search" role="dialog" aria-modal="true" aria-label="Search the shop" tabindex="-1">
    <div class="find">
      <svg viewBox="0 0 24 24" class="find__ic" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="findInput" class="find__input" type="search" placeholder="A title, an author, a mood — “grief”, “islands”, “Calvino”…" autocomplete="off" spellcheck="false" aria-label="Search books and rooms">
      <kbd class="find__kbd">esc</kbd>
    </div>
    <div class="find__results" id="findResults" role="listbox" aria-label="Results"></div>
  </div>
</div>

<div class="overlay" id="shelfOverlay" hidden aria-hidden="true">
  <div class="overlay__scrim" data-close></div>
  <div class="overlay__body overlay__body--parcel" role="dialog" aria-modal="true" aria-label="Everything on this shelf" tabindex="-1" id="shelfBody"></div>
</div>

<div class="overlay" id="parcelOverlay" hidden aria-hidden="true">
  <div class="overlay__scrim" data-close></div>
  <div class="overlay__body overlay__body--parcel" role="dialog" aria-modal="true" aria-label="Your parcel" tabindex="-1" id="parcelBody"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript>
  <div style="padding:3rem;max-width:40rem;margin:auto;font-family:Georgia,serif;color:#e8dcc8;background:#1a1210">
    <h1>The Nowhere Bookshop</h1>
    <p>The shop is built with JavaScript — the rooms, the shelves and the books all live there.
    Please enable it, and mind the step.</p>
  </div>
</noscript>

<script type="module" src="src/js/main.js"></script>
</body>
</html>
